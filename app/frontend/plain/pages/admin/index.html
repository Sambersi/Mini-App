<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>F Bot — Админ</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="../../tg.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
<div class="mobile-screen" data-page="admin">

  <div class="scroll-content">
    <div class="logs-controls">
      <div class="logs-row">
        <a id="admin-back" class="btn-mini ghost" href="../more/index.html">← назад</a>
        <div class="seg">
          <button id="mode-double" class="seg-btn">дабл</button>
          <button id="mode-finance" class="seg-btn active">общее</button>
        </div>
      </div>
      <div class="logs-row">
        <input id="logs-search" class="input logs-search" placeholder="поиск по ID...">
        <button id="logs-find" class="btn-mini">найти</button>
      </div>
      <div class="logs-row">
        <button id="logs-date-btn" class="btn-mini ghost">📅 выбрать время</button>
        <button id="logs-date-reset" class="btn-mini ghost hidden">⏱ последние</button>
        <input id="logs-date-input" type="datetime-local" class="input hidden">
      </div>
      <div class="logs-row">
        <select id="logs-types" class="select"></select>
        <select id="logs-view" class="select hidden">
          <option value="rounds">Раунды</option>
          <option value="bets">Ставки</option>
        </select>
      </div>
    </div>

    <div class="logs-table-wrap glass-card">
      <div id="logs-body" class="logs-scroll">
        <div class="logs-empty">Загрузка…</div>
      </div>
      <div class="logs-pager">
        <button id="logs-prev" class="btn-mini ghost">←</button>
        <span id="logs-page">стр. 1 из 1</span>
        <button id="logs-next" class="btn-mini ghost">→</button>
      </div>
    </div>
  </div>

  <!-- Модалка деталей раунда -->
  <div id="modal" class="modal" hidden>
    <div class="modal__box glass-card">
      <p id="modal-title" class="modal__title"></p>
      <div id="modal-body" class="modal__body"></div>
      <button id="modal-close" class="btn-mini">ок</button>
    </div>
  </div>

</div>
<script src="../../app.js"></script>
<script src="admin.js"></script>
</body>
</html>
